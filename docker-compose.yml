version: '3.9'

services:
  db:
    image: postgres:15
    container_name: pg-betterauth
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: express-betterauth
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/usr/src/app:cached
      -  /usr/src/app/node_modules   # Jangan mount node_modules dari host

volumes:
  db_data:
